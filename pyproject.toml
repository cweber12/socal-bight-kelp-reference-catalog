[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kelpcatalog"
version = "0.1.0"
description = "Source catalog for kelp forest monitoring in the Southern California Bight"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CATALOG.md"]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    # What a figure cell imports, and what produces the outputs it is committed with.
    # #47 declares matplotlib alone; ipykernel and nbclient are #48's and arrive a slice
    # early because they are what executed the committed figure. A notebook is committed
    # "with outputs so they read on GitHub without running" (CONTEXT.md, "Notebooks"), and
    # those outputs exist only because a kernel produced them, so a declaration naming only
    # what the cell imports leaves no way to reproduce them. #48 needs both declared
    # regardless. See the PR body for #47.
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
