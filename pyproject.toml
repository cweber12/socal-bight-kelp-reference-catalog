[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kelpcatalog"
version = "0.1.0"
description = "Source catalog for kelp forest monitoring in the Southern California Bight"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CATALOG.md"]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    # What a figure cell imports, and what produces the outputs it is committed with.
    # #47 declares matplotlib alone; ipykernel and nbclient are #48's and arrive a slice
    # early because they are what executed the committed figure. A notebook is committed
    # "with outputs so they read on GitHub without running" (CONTEXT.md, "Notebooks"), and
    # those outputs exist only because a kernel produced them, so a declaration naming only
    # what the cell imports leaves no way to reproduce them. #48 needs both declared
    # regardless. See the PR body for #47.
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8",
    "pytest-cov>=5",
    # Pinned exactly, alone among these. The others are libraries the code calls; ruff is a
    # checker whose verdict is the `lint` gate row, and a floor lets the gate job and CI's
    # lint job resolve different releases - so a new rule or a formatter change arrives as a
    # red CI on a PR that was green locally. #68 pins it and points CI's lint job at this
    # extra, which is what makes "gate.py is green" and "CI is green" the same claim. Bumping
    # it is a deliberate PR, which is the cost.
    "ruff==0.16.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repo root on sys.path so `tests/test_gate.py` can `import gate`, which sits at
# the root and outside [tool.setuptools.packages.find]. Declared here rather than through a
# conftest.py or a sys.path line in the test because this is the mechanism already carrying
# "src", and because it applies to both runners: a bare `import gate` passes under
# `python -m pytest` - which puts the working directory on sys.path, and which is how gate.py
# shells out - and fails under the `pytest` console script, which does not. A test of the file
# that decides whether the repo is green should not be invisible to whoever types `pytest`.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
