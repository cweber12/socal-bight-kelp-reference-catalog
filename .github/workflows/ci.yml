name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python gate.py
        env:
          PYTHONUTF8: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The dev extra, not a bare `pip install ruff`: the extra pins ruff exactly, so this job
      # and the gate job - and `gate.py`'s `lint` row locally - all run the same release.
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
